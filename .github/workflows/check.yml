name: Source and media checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgstreamer1.0-dev pkg-config gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - name: Validate scripts and manifest
        run: python -m unittest discover -s tests -v
      - name: Check formatting
        run: cargo +1.97.1 fmt -- --check
      - name: Lint media code
        run: cargo +1.97.1 clippy --locked --all-targets -- -D warnings
      - name: Run media tests
        run: cargo +1.97.1 test --locked
      - name: Exercise CPU encoding and reject overwrites
        run: |
          cargo +1.97.1 run --locked -- encode-test test.mp4 cpu
          test -s test.mp4
          if cargo +1.97.1 run --locked -- encode-test test.mp4 cpu; then
            echo 'ERROR: encoder overwrote an existing file'
            exit 1
          fi
      - name: Check workflow syntax
        uses: docker://rhysd/actionlint:1.7.7
